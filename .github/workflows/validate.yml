name: Validate Knowledge Pack

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: eval/requirements.txt
      - name: Install Required Pinned Validation Tools
        run: python -m pip install -r eval/requirements.txt
      - name: Test Structural Validator And Upstream Export
        run: python -m unittest discover -s plugin-tests/shopware-knowledge -p 'test_*.py' -v
      - name: Validate Native Pack And Portable ZIP
        run: python scripts/validate_skill_pack.py
      - name: Check Behavioral Fixtures Without Model Calls
        run: python eval/run.py check
      - name: Check Index And Preservation Accounting
        run: |
          python scripts/build_knowledge_index.py --check
          python scripts/preservation.py
          git diff --check
